name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 插件只支持 Windows：跑在 windows-latest 上才贴近真实环境
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: node --test

      - name: English gate (report only until the translation is finished)
        run: node tools/check-english.mjs
        continue-on-error: true
